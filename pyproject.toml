[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-knowledge-assistant"
version = "0.1.0"
description = "A demonstration RAG assistant over Confluence or local documents"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.3.20,<1.0",
    "langchain-community>=0.3.20,<1.0",
    "langchain-text-splitters>=0.3.6,<1.0",

    "langchain-openai>=0.3.10,<1.0",
    "langchain-ollama>=0.2.3,<1.0",

    "langchain-chroma>=0.2.2,<1.0",
    "langchain-huggingface>=0.1.2,<1.0",
    "sentence-transformers>=3.4.1",

    "atlassian-python-api>=3.41",
    "beautifulsoup4>=4.12",

    "gradio>=5.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "ruff>=0.6", "pre-commit>=3.7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "TID252", # disallow relative imports
]

[tool.ruff]
line-length = 120


[tool.pytest.ini_options]
pythonpath = ["src", "."]
